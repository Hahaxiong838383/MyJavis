<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Javis · 律动</title>
<style>
  :root{ --void:#04060c; --teal:#46cfe0; --ink:#cfe9ee; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--void);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
    color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block;position:fixed;inset:0}
  .brand{position:fixed;top:26px;left:50%;transform:translateX(-50%);z-index:3;
    font-size:12px;letter-spacing:.45em;color:rgba(207,233,238,.4);
    font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}

  .panel{position:fixed;left:50%;bottom:clamp(20px,5vh,46px);transform:translateX(-50%);
    z-index:3;display:flex;flex-direction:column;align-items:center;gap:16px;width:min(94vw,520px)}
  .btns{display:flex;gap:11px}
  .btn{appearance:none;cursor:pointer;border:1px solid rgba(70,207,224,.4);
    background:rgba(70,207,224,.06);color:var(--ink);padding:12px 24px;border-radius:999px;
    font-size:14px;letter-spacing:.04em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:.22s;display:flex;align-items:center;gap:9px}
  .btn:hover{background:rgba(70,207,224,.14)}
  .btn[data-on="1"]{border-color:var(--teal);background:rgba(70,207,224,.18);box-shadow:0 0 26px rgba(70,207,224,.22)}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(70,207,224,.4)}
  .btn[data-on="1"] .dot{background:var(--teal);box-shadow:0 0 9px var(--teal)}

  .meters{display:flex;gap:22px;font-family:ui-monospace,Menlo,monospace;font-size:11px;
    letter-spacing:.05em;color:rgba(207,233,238,.5)}
  .m{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px}
  .m b{font-weight:500;color:rgba(207,233,238,.42)}
  .bar{width:100%;height:3px;border-radius:2px;background:rgba(207,233,238,.12);overflow:hidden}
  .bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--teal),#eafcff)}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="brand">Javis</div>
  <div class="panel">
    <div class="btns">
      <button class="btn" id="bSpeak" data-on="0"><span class="dot"></span><span id="lbl">让 Javis 说话</span></button>
      <button class="btn" id="bMic" data-on="0">🎤 麦克风</button>
    </div>
    <div class="meters">
      <div class="m"><b>音量</b><div class="bar"><i id="mVol"></i></div></div>
      <div class="m"><b>音调</b><div class="bar"><i id="mPit"></i></div></div>
      <div class="m"><b>律动</b><div class="bar"><i id="mRhy"></i></div></div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  const cv=document.getElementById('c'), ctx=cv.getContext('2d');
  let DPR=Math.min(devicePixelRatio||1,2), Wd=0, Hd=0;
  function resize(){ DPR=Math.min(devicePixelRatio||1,2);
    Wd=innerWidth; Hd=innerHeight; cv.width=Wd*DPR; cv.height=Hd*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0); }
  resize(); addEventListener('resize',resize);

  // ---------- audio signals (smoothed) ----------
  let vol=0, pitch=0.4, rhythm=0;   // 0..1
  let mode='idle';                  // idle | speak | mic
  const ripples=[];
  let lastOnset=0;

  // simulated speech
  function synth(t){
    const burst=Math.max(0,Math.sin(t*7.0))*Math.max(0,Math.sin(t*2.1+0.6));
    const fine=0.6+0.4*Math.sin(t*13.0+Math.sin(t*3.0));
    const gap=(Math.sin(t*0.7)>-0.55)?1:0;
    const v=Math.min(1,burst*fine*gap*1.15);
    const p=0.5+0.4*Math.sin(t*1.3)+0.1*Math.sin(t*5.7);   // intonation contour
    return {v, p:Math.max(0,Math.min(1,p))};
  }

  // mic
  let actx=null,ana=null,tbuf=null,fbuf=null,stream=null;
  async function micOn(){ try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const s=actx.createMediaStreamSource(stream);
    ana=actx.createAnalyser(); ana.fftSize=2048;
    tbuf=new Float32Array(ana.fftSize); fbuf=new Uint8Array(ana.frequencyBinCount);
    s.connect(ana); return true;
  }catch(e){console.warn(e);return false;} }
  function micOff(){ if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;} ana=null; }
  function micRead(){
    if(!ana) return {v:0,p:pitch};
    ana.getFloatTimeDomainData(tbuf);
    let rms=0; for(let i=0;i<tbuf.length;i++) rms+=tbuf[i]*tbuf[i];
    rms=Math.sqrt(rms/tbuf.length);
    const v=Math.min(1, rms*3.4);
    ana.getByteFrequencyData(fbuf);
    let num=0,den=0;
    for(let i=0;i<fbuf.length;i++){ num+=i*fbuf[i]; den+=fbuf[i]; }
    let p=pitch;
    if(den>0){ const c=num/den/fbuf.length; p=Math.max(0,Math.min(1, c*2.2)); }
    return {v,p};
  }

  // ---------- main loop ----------
  let prevVol=0;
  function frame(t){
    t/=1000;

    let tv=0, tp=pitch;
    if(mode==='speak'){ const s=synth(t); tv=s.v; tp=s.p; }
    else if(mode==='mic'){ const m=micRead(); tv=m.v; tp=m.p; }

    vol += (tv-vol)*(tv>vol?0.4:0.12);
    pitch += (tp-pitch)*0.08;

    const rising = vol - prevVol;
    if(vol>0.18 && rising>0.06 && t-lastOnset>0.12){
      lastOnset=t; rhythm=1;
      ripples.push({r: orbR()*1.0, a:0.55});
    }
    prevVol=vol;
    rhythm*=0.92;

    draw(t);
    requestAnimationFrame(frame);
  }

  const cx=()=>Wd/2, cy=()=>Hd/2;
  const baseR=()=>Math.min(Wd,Hd)*0.16;
  function orbR(){ return baseR()*(1+vol*0.55) + Math.sin(perfT*0.9)*baseR()*0.03; }
  let perfT=0;

  function draw(t){
    perfT=t;
    // trail fade (persistence)
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(4,6,12,0.30)';
    ctx.fillRect(0,0,Wd,Hd);

    ctx.globalCompositeOperation='lighter';

    const CX=cx(), CY=cy(), R=orbR();
    const energy=vol;
    const hue=200 - pitch*55;
    const lobes=3 + Math.round(pitch*8);
    const amp=(6 + energy*70);

    // ambient center glow
    const bg=ctx.createRadialGradient(CX,CY,0,CX,CY,R*3.2);
    bg.addColorStop(0,`hsla(${hue},90%,60%,${0.05+energy*0.10})`);
    bg.addColorStop(1,'hsla(200,90%,60%,0)');
    ctx.fillStyle=bg; ctx.fillRect(0,0,Wd,Hd);

    // horizontal flowing wave (波浪) through center
    drawWave(CY, R, amp, lobes, t, hue, energy);

    // ripple rings (律动)
    for(let i=ripples.length-1;i>=0;i--){
      const rp=ripples[i]; rp.r += 4.5 + energy*4; rp.a*=0.945;
      if(rp.a<0.02){ ripples.splice(i,1); continue; }
      ctx.beginPath(); ctx.arc(CX,CY,rp.r,0,Math.PI*2);
      ctx.lineWidth=2; ctx.strokeStyle=`hsla(${hue},90%,70%,${rp.a})`; ctx.stroke();
    }

    // orb: layered radial-wave blobs
    drawOrb(CX,CY,R*0.78,amp*0.6,lobes,t*0.9,hue,energy,0.35);
    drawOrb(CX,CY,R,amp,lobes,t,hue,energy,0.9);

    // bright core, intensifies with 律动/音量 (peak -> white-hot)
    const flash=Math.min(1,energy*0.7+rhythm*0.6);
    const core=ctx.createRadialGradient(CX,CY,0,CX,CY,R*0.7);
    core.addColorStop(0,`hsla(${hue},${90-flash*70}%,${60+flash*38}%,${0.5+flash*0.4})`);
    core.addColorStop(1,`hsla(${hue},90%,60%,0)`);
    ctx.fillStyle=core; ctx.beginPath(); ctx.arc(CX,CY,R*0.7,0,Math.PI*2); ctx.fill();

    updateMeters();
  }

  function drawOrb(CX,CY,R,amp,lobes,t,hue,energy,alpha){
    const steps=200; ctx.beginPath();
    for(let i=0;i<=steps;i++){
      const a=(i/steps)*Math.PI*2;
      const w=Math.sin(a*lobes+t*1.5)*1.0 + Math.sin(a*lobes*2-t*1.1)*0.4 + Math.sin(a*3+t*0.7)*0.3;
      const r=R + w*amp;
      const x=CX+Math.cos(a)*r, y=CY+Math.sin(a)*r;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();
    const light=46+energy*40;
    const g=ctx.createRadialGradient(CX,CY,R*0.2,CX,CY,R+amp);
    g.addColorStop(0,`hsla(${hue},${90-energy*40}%,${Math.min(92,light+28)}%,${0.85*alpha})`);
    g.addColorStop(0.6,`hsla(${hue},88%,${light}%,${0.4*alpha})`);
    g.addColorStop(1,`hsla(${hue},85%,${light-8}%,0)`);
    ctx.fillStyle=g; ctx.fill();
    ctx.lineWidth=1.4; ctx.strokeStyle=`hsla(${hue},95%,${Math.min(95,light+30)}%,${0.55*alpha})`; ctx.stroke();
  }

  function drawWave(CY,R,amp,lobes,t,hue,energy){
    ctx.beginPath();
    const span=Math.min(Wd,1100), x0=cx()-span/2;
    const steps=160;
    for(let i=0;i<=steps;i++){
      const fx=i/steps, x=x0+fx*span;
      const env=Math.pow(Math.sin(fx*Math.PI),1.4);
      const w=Math.sin(fx*Math.PI*2*lobes + t*4.0)*0.6 + Math.sin(fx*Math.PI*2*lobes*0.5 - t*2.3)*0.4;
      const y=CY + w*amp*0.9*env;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.lineWidth=1.6+energy*1.6;
    ctx.strokeStyle=`hsla(${hue},95%,${60+energy*25}%,${0.25+energy*0.35})`;
    ctx.stroke();
  }

  // ---------- UI ----------
  const bSpeak=document.getElementById('bSpeak'), bMic=document.getElementById('bMic'),
        lbl=document.getElementById('lbl'),
        mVol=document.getElementById('mVol'), mPit=document.getElementById('mPit'), mRhy=document.getElementById('mRhy');
  function updateMeters(){
    mVol.style.width=(vol*100|0)+'%';
    mPit.style.width=(pitch*100|0)+'%';
    mRhy.style.width=(Math.min(1,rhythm)*100|0)+'%';
  }
  function setMode(m){
    mode=m;
    bSpeak.dataset.on=m==='speak'?'1':'0';
    bMic.dataset.on=m==='mic'?'1':'0';
    lbl.textContent=m==='speak'?'Javis 正在说话…':'让 Javis 说话';
    if(m!=='mic') micOff();
  }
  bSpeak.onclick=()=> setMode(mode==='speak'?'idle':'speak');
  bMic.onclick=async()=>{
    if(mode==='mic'){ setMode('idle'); bMic.textContent='🎤 麦克风'; return; }
    bMic.textContent='连接中…';
    const ok=await micOn();
    if(ok){ setMode('mic'); bMic.textContent='🎤 录音中'; }
    else{ bMic.textContent='麦克风不可用'; setTimeout(()=>bMic.textContent='🎤 麦克风',1500); }
  };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
