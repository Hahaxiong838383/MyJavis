[package]
name = "myjavis"
version = "0.8.1"
description = "MyJavis macOS Tauri shell"
authors = ["MyJavis"]
edition = "2021"
rust-version = "1.77"
default-run = "myjavis"

[lib]
name = "myjavis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "=0.3.44"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
