[package]
name = "myjavis"
version = "0.9.1"
description = "MyJavis macOS Tauri shell"
authors = ["MyJavis"]
edition = "2021"
rust-version = "1.77"
default-run = "myjavis"

[lib]
name = "myjavis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "=0.3.44"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# 贾维斯唤醒词（共存步3）：sherpa-onnx 官方 Rust API（static 静态链接打进 .app）+ cpal 采麦
sherpa-onnx = { version = "1.13.3", default-features = false, features = ["static"] }
cpal = "0.16"
